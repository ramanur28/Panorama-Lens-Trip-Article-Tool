services:
  article-generator:
    build: .
    container_name: gemini-article-generator
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WP_USERNAME=${WP_USERNAME:-}
      - WP_APPLICATION_PASSWORD=${WP_APPLICATION_PASSWORD:-}
    volumes:
      - ./data:/app/data