services:
  article-generator:
    image: ${DOCKERHUB_USERNAME:-your-username}/${DOCKERHUB_REPO:-gemini-article-generator}:${IMAGE_TAG:-latest}
    container_name: gemini-article-generator
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/auth/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"